# DexKit hand configuration (written by dexkit-calibrate-hand).
# Hand actions are floats in [0, 1] per finger servo (0 = slack, 1 = tight);
# roll is in degrees. Conversion to ticks happens only in hw/feetech_hand.py.
# HLS vs STS: address 44 is Goal Torque on HLS, Goal Time on STS.
port: /dev/dexkit_hand
baud: 1000000
fallback_baud: 115200
timeout_s: 0.02
voltage_window: [6.0, 8.4]
voltage_check_period_s: 2.0
max_temp_c: 65
rate_hz: 20
calibrated_at: '2026-10-02T02:24:09'  # per-servo `calibrated:` flags say which entries are real
servo_family: hls
registers: {}
servos:
- {id: 0, name: pinky_1, finger: pinky, slack: 17008, tight: 22976, inverted: false, max_delta_ticks: 120, stall_load: 200, calibrated: true}  # bench: this spool curls the PINKY
- {id: 1, name: thumb_abd, finger: thumb, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 2, name: thumb_rot, finger: thumb, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 3, name: index_flex, finger: index, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 4, name: index_abd, finger: index, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 5, name: middle_flex, finger: middle, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 6, name: middle_abd, finger: middle, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 7, name: ring_flex, finger: ring, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 8, name: ring_abd, finger: ring, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 9, name: pinky_flex, finger: pinky, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 10, name: pinky_abd, finger: pinky, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
- {id: 11, name: palm_cup, finger: palm, slack: 2048, tight: 2700, inverted: false, max_delta_ticks: 120, stall_load: 800}
roll: {id: 12, model: HLS3640M, center: 2048, range_deg: 90, inverted: false, max_delta_ticks: 120}
defaults: {accel: 50, speed: 1500, torque_limit: 600, goal_torque: 600, calib_torque_limit: 300, calib_step_ticks: 40, calib_max_travel_ticks: 12288, calib_direction: 1,
  stall_load_factor: 1.5, stall_time_s: 0.5, stall_backoff: 0.05}
